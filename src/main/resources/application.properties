# ── 공공데이터포털 TourAPI (국문 관광정보) ──────────────────────────
# base-url: KorService2 기준. (구버전 쓰면 .../KorService1 + op를 locationBasedList1 로)
tour.api.base-url=https://apis.data.go.kr/B551011/KorService2
tour.api.op.location-based=locationBasedList2
# 인증키: '디코딩(Decoding)' 키(raw)를 환경변수 TOUR_API_KEY 로 주입. 코드/깃엔 절대 안 박음.
tour.api.service-key=${TOUR_API_KEY:}
# 앱 식별자(MobileApp 파라미터로 전달)
tour.api.mobile-app=tour-api
# 업스트림 1콜 타임아웃(초). 집중률 API가 느려서 넉넉히(Lambda Timeout 30s보다 작게 유지)
tour.api.request-timeout-seconds=20
# 조회 기본/최대값
tour.api.default-radius=2000
tour.api.max-radius=20000
tour.api.default-size=20
tour.api.max-size=100

# ── 관광지 집중률(데이터랩 계열) ──────────────────────────────────
# 응답 봉투가 KorService와 다름: 성공은 nested, 에러는 flat {resultCode,resultMsg}
tour.api.concentration-base-url=https://apis.data.go.kr/B551011/TatsCnctrRateService
tour.api.op.concentration=tatsCnctrRatedList
# 좌표→시군구 역지오코딩용 반경(m)
tour.api.reverse-geocode-radius=3000
# 집중률 1페이지 행수(크게 잡아 대부분 시군구를 1콜로 수집; 시군구당 관광지×30일)
tour.api.concentration-page-size=5000
# 집중률 페이지 수집 상한(안전장치)
tour.api.concentration-max-pages=6

# ── Odii 도슨트(한국관광공사 관광지 오디오 가이드) ──────────────────
# 공공데이터포털에서 '관광지 오디오 가이드정보_GW' 활용신청 후 활성화한다.
# 미승인/장애 시에도 러닝 코스는 이야기 0건으로 정상 생성된다.
tour.audio.enabled=${TOUR_AUDIO_ENABLED:false}
tour.audio.base-url=https://apis.data.go.kr/B551011/Odii
# 코스 생성의 부가 조회이므로 전체 22초 예산을 잠식하지 않게 짧게 제한
tour.audio.request-timeout-seconds=3

# ── TMAP·Google (⚠️ 내부 전용 — 앱에 노출 금지) ────────────────────
# 키는 env TMAP_APP_KEY / GOOGLE_MAPS_API_KEY로만 주입(MP-Config 자동 매핑).
# ${..:} 형태로 여기 정의하면 빈값이 '값 없음' 처리돼 기동 실패 — 정의 금지(코드는 Optional 주입).
tmap.pedestrian-url=https://apis.openapi.sk.com/tmap/routes/pedestrian?version=1&format=json
# 네이버 지역검색(주변 맛집/카페 교차검증). 키는 env NAVER_CLIENT_ID / NAVER_CLIENT_SECRET로만 주입.
# 미설정이면 교차검증만 꺼지고 TourAPI 결과로 계속 동작한다.
naver.local-url=https://openapi.naver.com/v1/search/local.json
naver.request-timeout-seconds=4
# 네이버에만 있는 '최신 인기' 항목을 채택할 반경 배수(검색 반경 × 이 값)
nearby.trending-radius-factor=1.5
google.elevation-url=https://maps.googleapis.com/maps/api/elevation/json
tmap.request-timeout-seconds=8
google.elevation.request-timeout-seconds=8

# 실시간 코스 생성(routes·route-options)은 전체 마감·사용자 호출량을 공유한다.
running.generation.deadline-ms=22000
running.generation.rate-limit-per-minute=6

# ── 코스 카탈로그 ──────────────────────────────────────────────────
# 공유 기능용 코스 url의 베이스(Function URL 고정). 웹 상세 페이지가 생기면 그 주소로 교체
course.share-base-url=https://akt4wffwphw5czb3ofr2hy4hhm0emmil.lambda-url.ap-northeast-2.on.aws

# ── DynamoDB 캐시 ─────────────────────────────────────────────────
# 테이블명은 환경변수 CACHE_TABLE로 주입(Lambda). MP-Config가 CACHE_TABLE→cache.table 자동 매핑,
# 미설정이면 캐시 비활성(로컬/테스트 기본). 여기서 ${CACHE_TABLE:}로 정의하면 빈값이 '값 없음'으로
# 처리돼 기동이 실패하므로 properties에는 정의하지 않는다.

# ── OpenAPI / Swagger UI ──────────────────────────────────────────
quarkus.smallrye-openapi.info-title=Tour API
quarkus.smallrye-openapi.info-version=1.0.0
quarkus.smallrye-openapi.info-description=앱 백엔드 — 관광/러닝 추천(공공데이터 프록시). Swagger UI: /q/swagger-ui
# 배포(Lambda prod)에서도 Swagger UI 포함 (기본값은 dev 모드에서만 제공)
quarkus.swagger-ui.always-include=true

# ── 인증(Cognito) ──────────────────────────────────────────────────
# USER_POOL_ID / USER_POOL_CLIENT_ID / USERS_TABLE 은 env로만 주입(코드에서 Optional 주입 — 위 ${..:} 금지 규칙 동일).
# 미설정이어도 기동되도록 JWKS URL에는 placeholder default를 쓴다(JWKS는 첫 보호 요청에서만 조회).
mp.jwt.verify.publickey.location=https://cognito-idp.ap-northeast-2.amazonaws.com/${USER_POOL_ID:unset}/.well-known/jwks.json
mp.jwt.verify.issuer=https://cognito-idp.ap-northeast-2.amazonaws.com/${USER_POOL_ID:unset}
# 카카오 토큰 검증 URL (테스트에서 로컬로 교체 가능하게 설정으로 뺀다)
auth.kakao.user-me-url=https://kapi.kakao.com/v2/user/me
# Apple 로그인 — identityToken 검증에 쓰는 공개키 주소와 허용 aud(앱 번들 ID)
auth.apple.keys-url=https://appleid.apple.com/auth/keys
auth.apple.audience=com.mega.dali
