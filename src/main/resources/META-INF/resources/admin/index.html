<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>운영 콘솔 · tour-api</title>
<style>
:root{
  --paper:#EDEFEA;        /* 지형도 종이 */
  --card:#F6F7F4;
  --ink:#16211C;          /* 등고선 잉크 — 좌측 레일 */
  --ink-2:#1E2C26;
  --soft:#5C6B63;
  --rail-dim:#8A9990;
  --rule:#CFD6CE;
  --flag:#E2571F;         /* 신호 주황 — 문제에만 */
  --route:#2F6F5E;        /* 경로 선 */
  --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,monospace;
  --kr:-apple-system,"Apple SD Gothic Neo","Pretendard",system-ui,sans-serif;
  --rail:208px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{
  background:var(--paper); color:var(--ink);
  font-family:var(--kr); font-size:14px; line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
:focus-visible{outline:2px solid var(--flag); outline-offset:2px}
button{font:inherit}
/* display를 지정한 클래스가 [hidden]을 이기므로 못 박는다 */
[hidden]{display:none !important}
.mono{font-family:var(--mono)}

/* ── 좌측 레일 ── */
.rail{
  position:fixed; inset:0 auto 0 0; width:var(--rail); z-index:10;
  background:var(--ink); color:var(--paper);
  display:flex; flex-direction:column; padding:18px 0;
}
.rail-brand{
  font-family:var(--mono); font-size:11px; letter-spacing:.16em; text-transform:uppercase;
  color:var(--rail-dim); padding:0 18px 20px;
}
.rail-brand b{display:block; color:var(--paper); font-size:14px; letter-spacing:.04em; margin-top:3px}
.rail-nav{display:flex; flex-direction:column; gap:1px}
.rail-item{
  display:flex; align-items:center; gap:9px; width:100%; text-align:left;
  background:none; border:0; border-left:2px solid transparent; cursor:pointer;
  color:var(--rail-dim); padding:9px 18px; font-size:13.5px;
}
.rail-item:hover{color:var(--paper); background:var(--ink-2)}
.rail-item[aria-current="page"]{color:var(--paper); background:var(--ink-2); border-left-color:var(--flag)}
.rail-n{margin-left:auto; font-family:var(--mono); font-size:10.5px; opacity:.6}
.rail-foot{margin-top:auto; padding:16px 18px 0; border-top:1px solid rgba(237,239,234,.12)}
.rail-who{font-family:var(--mono); font-size:10.5px; color:var(--rail-dim); word-break:break-all}
.rail-out{
  margin-top:9px; background:none; border:1px solid rgba(237,239,234,.22); border-radius:2px;
  color:var(--rail-dim); font-family:var(--mono); font-size:10.5px; letter-spacing:.08em;
  padding:5px 9px; cursor:pointer;
}
.rail-out:hover{color:var(--paper); border-color:var(--paper)}

/* ── 본문 ── */
.main{margin-left:var(--rail); min-height:100%}
.head{
  position:sticky; top:0; z-index:9; background:var(--paper);
  border-bottom:1px solid var(--rule); padding:16px 24px 14px;
}
.head-h{font-size:17px; margin:0}
.head-p{color:var(--soft); font-size:12.5px; margin:3px 0 0}
.body-pad{padding:20px 24px 60px}

/* ── 필터 ── */
.filters{display:flex; flex-wrap:wrap; gap:6px; margin-bottom:18px}
.chip{
  font-family:var(--mono); font-size:11px; letter-spacing:.06em;
  background:none; border:1px solid var(--rule); border-radius:2px;
  color:var(--soft); padding:5px 10px; cursor:pointer;
}
.chip:hover{border-color:var(--soft); color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--ink); border-color:var(--ink); color:var(--paper)}
.chip-flag[aria-pressed="true"]{background:var(--flag); border-color:var(--flag)}

/* ── 컨택트시트 ── */
.sheet{display:grid; gap:15px; grid-template-columns:repeat(auto-fill,minmax(224px,1fr))}
.card{
  display:block; width:100%; text-align:left; cursor:pointer; color:inherit; font:inherit;
  background:var(--card); border:1px solid var(--rule); border-left:2px solid var(--rule);
  border-radius:3px; padding:0; overflow:hidden;
}
.card:hover{border-color:var(--soft)}
.card-flagged{border-left-color:var(--flag)}
.card-shot{position:relative; aspect-ratio:16/9; background:#DDE1DB}
.card-shot img{width:100%; height:100%; object-fit:cover; display:block}
.card-pin{position:absolute; right:7px; top:7px; display:flex; gap:4px}
.dot{width:8px; height:8px; border-radius:50%; box-shadow:0 0 0 3px rgba(246,247,244,.85)}
.dot-flag{background:var(--flag)}
.dot-edit{background:var(--route)}
.card-body{display:flex; gap:10px; padding:9px 11px 11px}
.card-sigil{flex:0 0 auto; width:44px; height:32px; margin-top:2px}
.card-text{min-width:0}
.card-meta{
  font-family:var(--mono); font-size:10.5px; letter-spacing:.07em; color:var(--soft);
  text-transform:uppercase; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.card-title{
  font-size:13px; line-height:1.35; margin-top:3px;
  display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;
}

/* ── 서랍 ── */
.scrim{position:fixed; inset:0; background:rgba(22,33,28,.34); z-index:30}
.drawer{
  position:fixed; top:0; right:0; bottom:0; width:min(660px,100vw); z-index:31;
  background:var(--paper); border-left:1px solid var(--rule);
  overflow-y:auto; animation:slide .14s ease-out;
}
@keyframes slide{from{transform:translateX(18px); opacity:.4} to{transform:none; opacity:1}}
@media (prefers-reduced-motion:reduce){ .drawer{animation:none} }
.drawer-head{
  position:sticky; top:0; z-index:2; display:flex; align-items:center; gap:12px;
  padding:12px 18px; background:var(--paper); border-bottom:1px solid var(--rule);
}
.drawer-id{font-family:var(--mono); font-size:11px; letter-spacing:.08em; color:var(--soft)}
.pane{padding:18px}
.pane-shot img{width:100%; border:1px solid var(--rule); border-radius:3px; display:block}
.h1{font-size:19px; line-height:1.3; margin:15px 0 4px}
.sub{color:var(--soft); margin:0 0 15px}
.stats{
  display:flex; flex-wrap:wrap; gap:0 24px; font-family:var(--mono); font-size:10.5px;
  letter-spacing:.06em; color:var(--soft); text-transform:uppercase;
  border-top:1px solid var(--rule); border-bottom:1px solid var(--rule); padding:10px 0;
}
.stats b{display:block; color:var(--ink); font-size:15px; letter-spacing:0; font-weight:600}
.h2{
  font-family:var(--mono); font-size:10.5px; letter-spacing:.14em; text-transform:uppercase;
  color:var(--soft); margin:22px 0 9px;
}
.map{width:100%; border:1px solid var(--rule); border-radius:3px; background:var(--card); display:block}
.rows{width:100%; border-collapse:collapse; font-family:var(--mono); font-size:11.5px}
.rows th{
  text-align:left; font-weight:400; letter-spacing:.08em; text-transform:uppercase;
  color:var(--soft); font-size:10px; padding:0 8px 6px 0; border-bottom:1px solid var(--rule);
}
.rows td{padding:7px 8px 7px 0; border-bottom:1px solid var(--rule); vertical-align:top}
.rows-name{font-family:var(--kr); font-size:12.5px}
.row-click{cursor:pointer}
.row-click:hover td{background:var(--card)}
.num{color:var(--soft)}
.ok{color:var(--route)}
.bad{color:var(--flag); font-weight:600}
.note{border-left:2px solid var(--flag); background:rgba(226,87,31,.06); padding:9px 12px; margin:9px 0; font-size:12.5px}
.note-quiet{border-left-color:var(--rule); background:rgba(92,107,99,.07)}
.note-ok{border-left-color:var(--route); background:rgba(47,111,94,.08)}
.lic{font-family:var(--mono); font-size:11px; color:var(--soft); word-break:break-all}

/* ── 폼 ── */
.field{
  font-family:var(--kr); font-size:13.5px; padding:8px 10px; width:100%; display:block;
  border:1px solid var(--rule); border-radius:2px; background:var(--card); color:var(--ink);
}
.field:focus{border-color:var(--soft)}
textarea.field{resize:vertical; line-height:1.65; min-height:70px}
.field-mono{font-family:var(--mono); font-size:12px}
.label{
  display:block; font-family:var(--mono); font-size:10px; letter-spacing:.14em;
  text-transform:uppercase; color:var(--soft); margin:16px 0 5px;
}
.label small{font-family:var(--kr); letter-spacing:0; text-transform:none; opacity:.85; margin-left:7px}
.btn{
  font-family:var(--mono); font-size:11px; letter-spacing:.08em; text-transform:uppercase;
  background:none; border:1px solid var(--rule); border-radius:2px;
  color:var(--soft); padding:7px 12px; cursor:pointer;
}
.btn:hover{color:var(--ink); border-color:var(--soft)}
.btn-go{background:var(--ink); border-color:var(--ink); color:var(--paper)}
.btn-go:hover{background:var(--ink-2); border-color:var(--ink-2); color:var(--paper)}
.btn-danger:hover{color:var(--flag); border-color:var(--flag)}
.btn[disabled]{opacity:.35; cursor:not-allowed}
.btn-close{margin-left:auto}
.savebar{
  position:sticky; bottom:0; display:flex; align-items:center; gap:9px;
  padding:12px 18px; margin:22px -18px -18px;
  background:var(--paper); border-top:1px solid var(--rule);
}
.savebar-msg{font-family:var(--mono); font-size:11px; color:var(--soft); margin-left:auto}

/* ── 설정 ── */
.panel{
  max-width:520px; background:var(--card); border:1px solid var(--rule);
  border-radius:3px; padding:20px 22px;
}
.panel + .panel{margin-top:16px}
.panel-h{font-size:15px; margin:0 0 4px}
.panel-p{color:var(--soft); font-size:12.5px; margin:0 0 6px}
.stepper{display:flex; align-items:center; gap:10px; margin-top:6px}
.stepper .field{width:88px; text-align:center; font-family:var(--mono); font-size:16px; padding:9px}
.stepper-unit{font-family:var(--mono); font-size:11px; color:var(--soft); letter-spacing:.06em}

/* ── 로그인 ── */
.gate-form{max-width:320px; margin:14vh auto 0; padding:0 20px}
.gate-h{font-size:19px; margin:0 0 6px}
.gate-p{color:var(--soft); font-size:13px; margin:0 0 20px}
.gate-form .btn-go{margin-top:20px; width:100%; padding:10px}
.empty{color:var(--soft); padding:44px 0; text-align:center}
.modal{
  position:fixed; z-index:40; top:50%; left:50%; transform:translate(-50%,-50%);
  width:min(440px,92vw); background:var(--paper);
  border:1px solid var(--ink); border-radius:3px; padding:18px;
}
@media (max-width:720px){
  :root{--rail:0px}
  .rail{position:static; width:auto; flex-direction:row; align-items:center; padding:10px 14px; gap:14px}
  .rail-brand{padding:0; display:none}
  .rail-nav{flex-direction:row}
  .rail-item{padding:7px 11px; border-left:0; border-bottom:2px solid transparent}
  .rail-item[aria-current="page"]{border-left:0; border-bottom-color:var(--flag)}
  .rail-foot{margin:0 0 0 auto; padding:0; border:0}
  .rail-who{display:none}
}
</style>
</head>
<body>

<nav class="rail" id="rail" hidden>
  <div class="rail-brand">tour-api<b>운영 콘솔</b></div>
  <div class="rail-nav" role="tablist">
    <button class="rail-item" id="nav-courses" role="tab" aria-current="page">코스<span class="rail-n" id="n-courses"></span></button>
    <button class="rail-item" id="nav-users" role="tab">가입자<span class="rail-n" id="n-users"></span></button>
    <button class="rail-item" id="nav-settings" role="tab">설정</button>
  </div>
  <div class="rail-foot">
    <div class="rail-who" id="who"></div>
    <button class="rail-out" id="signout" hidden>로그아웃</button>
  </div>
</nav>

<main class="main" id="main">
  <div id="gate" hidden>
    <form class="gate-form" id="gate-form">
      <h1 class="gate-h">운영 콘솔</h1>
      <p class="gate-p">허용된 이메일 계정만 들어올 수 있다. 앱에서 쓰는 계정과 같다.</p>
      <label class="label" for="gate-email">이메일</label>
      <input class="field" id="gate-email" type="email" autocomplete="username" required>
      <label class="label" for="gate-pw">비밀번호</label>
      <input class="field" id="gate-pw" type="password" autocomplete="current-password" required>
      <button class="btn btn-go" id="gate-go" type="submit">들어가기</button>
      <p class="lic" id="gate-msg" role="status" aria-live="polite"></p>
    </form>
  </div>

  <div id="page" hidden>
    <header class="head">
      <h1 class="head-h" id="head-h"></h1>
      <p class="head-p" id="head-p"></p>
    </header>
    <div class="body-pad">
      <section id="view-courses">
        <div class="filters" id="filters"></div>
        <div class="sheet" id="sheet"></div>
      </section>
      <section id="view-users" hidden></section>
      <section id="view-settings" hidden></section>
    </div>
  </div>
</main>

<script>
const $ = s => document.querySelector(s);
const el = (t, a = {}, kids = []) => {
  const n = document.createElement(t);
  for (const [k, v] of Object.entries(a)) {
    if (v === null || v === false || v === undefined) continue;
    if (k === 'text') n.textContent = v;
    else if (k === 'html') n.innerHTML = v;
    else n.setAttribute(k, v);
  }
  for (const c of [].concat(kids)) if (c) n.append(c);
  return n;
};

/* 이 파일 한 벌이 세 곳에서 돈다.
   embed — --export 로 뽑은 단일 파일. 데이터가 페이지 안에 있고 서버가 없다.
   local — admin/serve.py. 맥의 ~/.aws 자격증명을 쓰므로 로그인이 필요 없다.
   cloud — Lambda가 서빙. Cognito 토큰을 보내고 서버가 이메일 허용목록으로 거른다.
   원고 편집과 설정은 저장이 필요해 cloud 에서만 열린다. */
const EMBED = window.__EMBED__ || null;
const LOCAL = !!window.__LOCAL__;
const MODE = EMBED ? 'embed' : LOCAL ? 'local' : 'cloud';
const CAN_EDIT = MODE === 'cloud';
let TOKEN = sessionStorage.getItem('adminToken') || '';

class Unauthorized extends Error {}
const hasToken = u => u.hasAppleToken === true || u.hasAppleToken === 'true';

async function call(url, opts = {}) {
  const headers = { ...(opts.headers || {}) };
  if (MODE === 'cloud' && TOKEN) headers.Authorization = 'Bearer ' + TOKEN;
  if (opts.body) headers['Content-Type'] = 'application/json';
  const res = await fetch(url, { ...opts, headers });
  if (res.status === 401 || res.status === 403) {
    TOKEN = ''; sessionStorage.removeItem('adminToken');
    throw new Unauthorized(res.status === 403 ? '이 계정에는 관리 권한이 없다' : '다시 로그인해라');
  }
  const body = res.status === 204 ? {} : await res.json();
  if (!res.ok) throw new Error(body.message || '요청이 실패했다');
  return body;
}

const API = {
  courses: () => EMBED ? Promise.resolve(EMBED.courses)
    : call(LOCAL ? '/api/courses' : '/v1/admin/courses/review'),
  course: id => EMBED ? Promise.resolve(EMBED.details[id])
    : call(LOCAL ? '/api/courses/' + id : '/v1/admin/courses/' + id),
  saveCourse: (id, patch) => call('/v1/admin/courses/' + id,
    { method: 'PUT', body: JSON.stringify(patch) }),
  resetCourse: id => call('/v1/admin/courses/' + id + '/edits', { method: 'DELETE' }),
  users: () => EMBED ? Promise.resolve({ error: '내보낸 파일에는 가입자가 없다.' })
    : call(LOCAL ? '/api/users' : '/v1/admin/users'),
  removeUser: id => LOCAL
    ? call('/api/users/delete', { method: 'POST', body: JSON.stringify({ userId: id }) })
    : call('/v1/admin/users/' + id, { method: 'DELETE' }),
  setUserLimit: (id, dailyLimit) => call('/v1/admin/users/' + id + '/limit',
    { method: 'PUT', body: JSON.stringify({ dailyLimit }) }),
  resetQuota: id => call('/v1/admin/users/' + id + '/quota', { method: 'DELETE' }),
  settings: () => call('/v1/admin/settings'),
  saveSettings: p => call('/v1/admin/settings', { method: 'PUT', body: JSON.stringify(p) }),
};

/* ── 경로 그리기 ── */
function project(points, w, h, pad) {
  const lats = points.map(p => p[0]), lngs = points.map(p => p[1]);
  const midLat = (Math.min(...lats) + Math.max(...lats)) / 2;
  const kx = Math.cos(midLat * Math.PI / 180);
  const xs = lngs.map(v => v * kx), ys = lats.map(v => -v);
  const [x0, x1] = [Math.min(...xs), Math.max(...xs)];
  const [y0, y1] = [Math.min(...ys), Math.max(...ys)];
  const s = Math.min((w - pad * 2) / (x1 - x0 || 1e-9), (h - pad * 2) / (y1 - y0 || 1e-9));
  const ox = (w - (x1 - x0) * s) / 2, oy = (h - (y1 - y0) * s) / 2;
  return (lat, lng) => [(lng * kx - x0) * s + ox, (-lat - y0) * s + oy];
}
const NS = 'http://www.w3.org/2000/svg';
const sv = (t, a) => { const n = document.createElementNS(NS, t);
  for (const [k, v] of Object.entries(a)) n.setAttribute(k, v); return n; };
const dOf = (pts, to) => pts.map((p, i) =>
  (i ? 'L' : 'M') + to(p[0], p[1]).map(n => n.toFixed(1)).join(' ')).join('');

/* 카드마다 붙는 그 코스의 실제 경로 모양 */
function sigil(points, shape) {
  const W = 44, H = 32;
  const g = sv('svg', { viewBox: `0 0 ${W} ${H}`, width: W, height: H, 'aria-hidden': 'true' });
  if (!points || points.length < 2) return g;
  const to = project(points, W, H, 4);
  g.append(sv('path', { d: dOf(points, to), fill: 'none', stroke: 'var(--route)',
    'stroke-width': 1.4, 'stroke-linejoin': 'round', 'stroke-linecap': 'round' }));
  if (shape !== 'roundTrip') {              // 편도는 종점을 찍어 구분한다
    const [x, y] = to(...points.at(-1));
    g.append(sv('rect', { x: x - 2, y: y - 2, width: 4, height: 4, fill: 'var(--route)' }));
  }
  return g;
}

/* ── 코스 목록 ── */
let COURSES = [], USERS = [], FILTER = 'all';
const FILTERS = [
  ['all', '전체'], ['flagged', '볼 것'], ['edited', '수정됨'],
  ['off-route', '경유지 경로 밖'], ['placelat', '원 좌표 어긋남'],
  ['dup-photo', '사진 중복'], ['license', '제3유형'], ['substitute', '대체 사진'],
];
const countFor = kind =>
  kind === 'all' ? COURSES.length
  : kind === 'flagged' ? COURSES.filter(c => c.flags.length).length
  : kind === 'edited' ? COURSES.filter(c => c.edited).length
  : COURSES.filter(c => c.flags.some(f => f.kind === kind)).length;
const matches = c =>
  FILTER === 'all' ? true
  : FILTER === 'flagged' ? c.flags.length > 0
  : FILTER === 'edited' ? !!c.edited
  : c.flags.some(f => f.kind === FILTER);

function drawFilters() {
  $('#filters').replaceChildren(...FILTERS.map(([kind, label]) => {
    const n = countFor(kind);
    if (!n && kind !== 'all') return null;   // 걸리는 게 없는 조건은 띄우지 않는다
    const b = el('button', {
      class: 'chip' + (['all', 'flagged', 'edited'].includes(kind) ? '' : ' chip-flag'),
      'aria-pressed': String(FILTER === kind), text: `${label} ${n}`,
    });
    b.onclick = () => { FILTER = kind; drawFilters(); drawSheet(); window.scrollTo(0, 0); };
    return b;
  }).filter(Boolean));
}

function drawSheet() {
  const list = COURSES.filter(matches);
  if (!list.length) {
    $('#sheet').replaceChildren(el('p', { class: 'empty', text: '이 조건에 걸리는 코스가 없다.' }));
    return;
  }
  $('#sheet').replaceChildren(...list.map(c => {
    const pins = el('span', { class: 'card-pin' }, [
      c.edited ? el('span', { class: 'dot dot-edit', title: '원고 수정됨' }) : null,
      c.flags.length ? el('span', { class: 'dot dot-flag' }) : null,
    ]);
    const card = el('button', {
      class: 'card' + (c.flags.length ? ' card-flagged' : ''),
      title: c.flags.map(f => f.label).join('\n') || c.id,
    }, [
      el('div', { class: 'card-shot' }, [
        el('img', { src: c.photo, alt: c.photoTitle || '', loading: 'lazy' }), pins]),
      el('div', { class: 'card-body' }, [
        el('span', { class: 'card-sigil' }, [sigil(c.sigil, c.shape)]),
        el('span', { class: 'card-text' }, [
          el('span', { class: 'card-meta', text: `${c.city} · ${c.km}km · 경유지 ${c.poiCount}` }),
          el('span', { class: 'card-title', text: c.headline }),
        ]),
      ]),
    ]);
    card.onclick = () => openCourse(c.id);
    return card;
  }));
}

/* 상세 지도 — 경유지 번호를 실제 좌표 위에 찍고, 원 좌표가 멀면 점선으로 잇는다 */
function routeMap(d) {
  const W = 600, H = 380;
  const s = sv('svg', { viewBox: `0 0 ${W} ${H}`, class: 'map', role: 'img',
    'aria-label': '경로와 경유지 위치' });
  if (!d.polyline || !d.polyline.length) return s;
  const pts = d.polyline.concat(d.poi.flatMap(p => p.place ? [[p.place.lat, p.place.lng]] : []));
  const to = project(pts, W, H, 26);
  s.append(sv('path', { d: dOf(d.polyline, to), fill: 'none', stroke: 'var(--route)',
    'stroke-width': 2.4, 'stroke-linejoin': 'round', 'stroke-linecap': 'round' }));
  for (const p of d.poi) {
    const [x, y] = to(p.lat, p.lng);
    if (p.place && p.place.offRouteM > 100) {
      const [px, py] = to(p.place.lat, p.place.lng);
      s.append(sv('line', { x1: x, y1: y, x2: px, y2: py, stroke: 'var(--flag)',
        'stroke-width': 1, 'stroke-dasharray': '3 3' }));
      s.append(sv('circle', { cx: px, cy: py, r: 5, fill: 'none',
        stroke: 'var(--flag)', 'stroke-width': 1.5 }));
    }
    s.append(sv('circle', { cx: x, cy: y, r: 10,
      fill: p.offRouteM > 100 ? 'var(--flag)' : 'var(--ink)' }));
    const t = sv('text', { x, y: y + 3.6, 'text-anchor': 'middle', fill: 'var(--paper)',
      'font-size': 10.5, 'font-family': 'var(--mono)' });
    t.textContent = p.no;
    s.append(t);
  }
  return s;
}

function pointRows(items, label) {
  return el('table', { class: 'rows' }, [
    el('thead', {}, [el('tr', {}, ['#', label, '좌표', '경로에서'].map(h => el('th', { text: h })))]),
    el('tbody', {}, items.map(p => el('tr', {}, [
      el('td', { class: 'num', text: p.no }),
      el('td', { class: 'rows-name', text: p.name || '' }),
      el('td', { text: `${p.lat.toFixed(5)}, ${p.lng.toFixed(5)}` }),
      el('td', { class: p.offRouteM > 100 ? 'bad' : 'ok', text: `${p.offRouteM}m` }),
    ]))),
  ]);
}

const TEXT_FIELDS = [
  ['n', '코스 이름', '목록·공유에 쓰는 짧은 이름'],
  ['headline', '큰 제목', '앱 상세 맨 위에 크게 나오는 문장'],
  ['subhead', '한 줄 소개', '제목 바로 아래 회색 문장'],
];
const PARA_FIELDS = [
  ['body', '본문', '“어떤 길인지” 아래 문단들'],
  ['deep', '더 읽을거리', '배경·유래 문단들'],
  ['ops', '운영 정보', '주차·시간·주의사항 문단들'],
];
const PHOTO_FIELDS = [
  ['photo', '사진 URL', ''],
  ['photoTitle', '사진 제목', '사진 위에 겹쳐 나오는 이름'],
  ['photoLicense', '저작권 표기', ''],
];
const toText = v => Array.isArray(v) ? v.join('\n') : (v ?? '');
const toPara = s => s.split('\n').map(x => x.trim()).filter(Boolean);

function editor(d, refresh) {
  const inputs = new Map();
  const field = ([key, label, hint], multiline) => {
    const id = 'f-' + key;
    const node = el(multiline ? 'textarea' : 'input', {
      class: 'field' + (key === 'photo' || key === 'photoLicense' ? ' field-mono' : ''),
      id, rows: multiline ? Math.min(12, Math.max(3, toText(d[key]).split('\n').length + 1)) : null,
    });
    node.value = toText(d[key]);
    inputs.set(key, node);
    return el('div', {}, [
      el('label', { class: 'label', for: id }, [
        document.createTextNode(label),
        hint ? el('small', { text: hint }) : null]),
      node,
    ]);
  };

  const msg = el('span', { class: 'savebar-msg', role: 'status', 'aria-live': 'polite' });
  const save = el('button', { class: 'btn btn-go', text: '저장' });
  const reset = el('button', { class: 'btn btn-danger', text: '원본으로 되돌리기' });

  save.onclick = async () => {
    const patch = {};
    for (const [key, node] of inputs) {
      const isPara = PARA_FIELDS.some(([k]) => k === key);
      patch[key] = isPara ? toPara(node.value) : node.value.trim();
    }
    save.disabled = reset.disabled = true;
    msg.textContent = '저장 중…';
    try {
      await API.saveCourse(d.id, patch);
      msg.textContent = '저장했다. 앱에는 최대 1분 뒤 반영된다.';
      refresh();
    } catch (e) {
      msg.textContent = e.message;
    } finally {
      save.disabled = reset.disabled = false;
    }
  };
  reset.onclick = async () => {
    reset.disabled = save.disabled = true;
    msg.textContent = '되돌리는 중…';
    try {
      await API.resetCourse(d.id);
      msg.textContent = '번들 원본으로 되돌렸다.';
      refresh();
    } catch (e) {
      msg.textContent = e.message;
    } finally {
      reset.disabled = save.disabled = false;
    }
  };

  return el('div', {}, [
    el('h3', { class: 'h2', text: '앱에 보이는 글' }),
    el('p', { class: 'note note-quiet', text:
      '여기서 고친 글이 앱 상세 화면에 그대로 나간다. 문단은 한 줄에 하나씩 쓴다. '
      + '경로·경유지·도슨트 좌표는 배포 게이트가 검증하는 값이라 여기서 못 고친다.' }),
    ...TEXT_FIELDS.map(f => field(f, false)),
    ...PARA_FIELDS.map(f => field(f, true)),
    el('h3', { class: 'h2', text: '대표 사진' }),
    ...PHOTO_FIELDS.map(f => field(f, false)),
    el('div', { class: 'savebar' }, [save, reset, msg]),
  ]);
}

  try { data = await API.users(); }
  catch (e) {
    if (e instanceof Unauthorized) return gate(e.message);

          .map(h => el('th', { text: h })))]),
      el('tbody', {}, data.users.map(u => {
        const del = el('button', { class: 'btn btn-danger', text: '삭제' });
        del.onclick = e => { e.stopPropagation(); confirmDelete(u); };
        // 로컬 서버는 쿼터를 계산하지 않는다 — 값이 없으면 칸을 비운다
        const hasQuota = u.effectiveDailyLimit !== undefined;

          title: 'DB 값 전체 보기 · 한도 수정' }, [

          el('td', { text: u.email || '—' }),

          el('td', { class: !hasQuota || left === null ? 'num' : left === 0 ? 'bad' : 'ok',
            text: !hasQuota ? '—' : left === null ? '알 수 없음'
              : `${left} / ${u.effectiveDailyLimit}` }),
          el('td', { class: u.dailyLimit ? 'ok' : 'num',
            text: !hasQuota ? '—' : u.dailyLimit ? `개별 ${u.dailyLimit}` : `기본 ${dflt}` }),
          el('td', { class: hasToken(u) ? 'ok' : 'num',

        row.onclick = open;

        return row;

/* 이 사용자에 대해 DB가 들고 있는 것 전부 + 생성 한도 조절 */
function openUser(u, dflt) {
  const quota = CAN_EDIT && u.effectiveDailyLimit !== undefined;
  const msg = el('span', { class: 'savebar-msg', role: 'status', 'aria-live': 'polite' });
  const limit = el('input', { class: 'field', type: 'number', min: 1, max: 100,
    id: 'u-limit', placeholder: `기본 ${dflt}` });
  if (u.dailyLimit) limit.value = u.dailyLimit;

  const apply = el('button', { class: 'btn btn-go', text: '한도 적용' });
  const clear = el('button', { class: 'btn', text: '기본값으로' });
  const reset = el('button', { class: 'btn btn-danger', text: '오늘 사용량 0으로' });
  const run = async (fn, ok) => {
    apply.disabled = clear.disabled = reset.disabled = true;
    msg.textContent = '적용 중…';
    try { await fn(); msg.textContent = ok; await drawUsers(); }
    catch (e) { msg.textContent = e.message; }
    finally { apply.disabled = clear.disabled = reset.disabled = false; }
  };
  apply.onclick = () => run(() => API.setUserLimit(u.userId, Number(limit.value)),
    '이 사용자 한도를 바꿨다.');
  clear.onclick = () => run(() => API.setUserLimit(u.userId, null),
    '전체 기본값을 따르게 했다.');
  reset.onclick = () => run(() => API.resetQuota(u.userId),
    '오늘 사용량을 되돌렸다. 지금부터 다시 쓸 수 있다.');

  // DB 원본 값 전부 — 어떤 필드가 있는지 화면이 감추지 않는다
  const HIDE = new Set(['effectiveDailyLimit', 'usesToday', 'remainingToday']);
  const raw = el('table', { class: 'rows' }, [
    el('tbody', {}, Object.entries(u).filter(([k]) => !HIDE.has(k)).map(([k, v]) =>
      el('tr', {}, [
        el('td', { class: 'num', style: 'width:38%', text: k }),
        el('td', { text: v === null || v === '' ? '—' : String(v) }),
      ]))),
  ]);

  const close = el('button', { class: 'btn btn-close', text: '닫기 ESC' });
  const drawer = el('aside', { class: 'drawer', role: 'dialog', 'aria-modal': 'true',
    'aria-label': u.nickname || u.userId }, [
    el('div', { class: 'drawer-head' }, [
      el('span', { class: 'drawer-id', text: u.userId }), close]),
    el('div', { class: 'pane' }, [
      el('h2', { class: 'h1', text: u.nickname || '(닉네임 없음)' }),
      el('p', { class: 'sub', text: `${u.provider || '?'} · ${u.email || '이메일 없음'}` }),
      quota ? el('div', { class: 'stats' }, [
        el('span', { html: `<b>${u.usesToday < 0 ? '?' : u.usesToday}</b>오늘 사용` }),
        el('span', { html: `<b>${u.remainingToday ?? '?'}</b>남음` }),
        el('span', { html: `<b>${u.effectiveDailyLimit}</b>적용 한도` }),
        el('span', { html: `<b>${u.dailyLimit ? '개별' : '기본'}</b>한도 출처` }),
      ]) : null,
      quota ? el('h3', { class: 'h2', text: '코스 생성 한도' }) : null,
      quota ? el('p', { class: 'note note-quiet', text:
        `이 사용자만의 하루 한도를 정한다. 비우고 “기본값으로”를 누르면 전체 설정(${dflt}회)을 따른다. `
        + '한도를 올려도 오늘 이미 쓴 횟수는 그대로이니, 지금 당장 풀어주려면 사용량을 되돌려라.' }) : null,
      quota ? el('div', { class: 'stepper' }, [limit,
        el('span', { class: 'stepper-unit', text: '회 / 일' })]) : null,
      quota ? el('div', { class: 'savebar' }, [apply, clear, reset, msg]) : null,
      el('h3', { class: 'h2', text: 'DB에 저장된 값' }),
      raw,
      el('p', { class: 'lic', text:
        'Apple 폐기 토큰은 값 없이 존재 여부(hasAppleToken)만 내려온다.' }),
    ]),
  ]);
  const scrim = el('div', { class: 'scrim' });
  const shut = () => { scrim.remove(); drawer.remove(); document.removeEventListener('keydown', esc); };
  const esc = e => { if (e.key === 'Escape') shut(); };
  close.onclick = shut; scrim.onclick = shut;
  document.addEventListener('keydown', esc);
  document.body.append(scrim, drawer);
  close.focus();
}

function confirmDelete(u) {
  const name = u.nickname || u.userId;
  const input = el('input', { class: 'field field-mono', placeholder: name, 'aria-label': '닉네임 입력' });
  const go = el('button', { class: 'btn btn-go', text: '삭제', disabled: 'true' });

  const out = el('p', { class: 'lic' });
  input.oninput = () => { go.disabled = input.value !== name; };
  const scrim = el('div', { class: 'scrim' });
  const modal = el('div', { class: 'modal', role: 'dialog', 'aria-modal': 'true' }, [
    el('h3', { class: 'h2', text: '가입자 삭제' }),
    el('p', { text: `${name} 의 프로필 행과 Cognito 계정을 지운다. 되돌릴 수 없다.` }),
    el('p', { class: 'note', text:
      'Apple 토큰 폐기는 여기서 하지 않는다. 심사 5.1.1(v)를 지키려면 앱의 탈퇴 화면을 쓸 것.' }),
    el('p', { class: 'lic', text: `확인하려면 “${name}” 을 그대로 입력해라.` }),
    input, el('p', {}, [go, ' ', cancel]), out,
  ]);
  const shut = () => { scrim.remove(); modal.remove(); };
  cancel.onclick = shut; scrim.onclick = shut;
  go.onclick = async () => {
    go.disabled = true; out.textContent = '삭제 중…';
    try { await API.removeUser(u.userId); }
    catch (e) { out.textContent = e.message; go.disabled = false; return; }
    shut(); drawUsers();
  };
  document.body.append(scrim, modal);
  input.focus();
}

  ]));
}

/* ── 화면 전환 ── */
const PAGES = {
  courses: { title: '코스 검수', desc: '사진·경로·저작권에서 사람이 봐야 할 것만 표시한다. 카드를 열면 원고를 고칠 수 있다.' },
  users:   { title: '가입자',   desc: '앱에 가입한 계정. 삭제는 되돌릴 수 없다.' },
  settings:{ title: '설정',     desc: '배포 없이 바꿀 수 있는 운영값.' },
};
function show(which) {
  for (const k of Object.keys(PAGES)) {
    $('#view-' + k).hidden = k !== which;
    $('#nav-' + k).setAttribute('aria-current', k === which ? 'page' : 'false');
  }
  $('#head-h').textContent = PAGES[which].title;
  $('#head-p').textContent = PAGES[which].desc;
  window.scrollTo(0, 0);
  if (which === 'users') drawUsers();
  if (which === 'settings') drawSettings();
}
for (const k of Object.keys(PAGES)) $('#nav-' + k).onclick = () => show(k);

/* ── 로그인 ── */
function gate(message) {
  document.querySelectorAll('.scrim,.drawer,.modal').forEach(n => n.remove());
  $('#page').hidden = true;
  $('#rail').hidden = true;
  $('#gate').hidden = false;
  $('#gate-msg').textContent = message || '';
  $('#gate-email').focus();
}

$('#gate-form').addEventListener('submit', async e => {
  e.preventDefault();
  const btn = $('#gate-go');
  btn.disabled = true;
  $('#gate-msg').textContent = '확인 중…';
  try {
    const res = await fetch('/v1/auth/login', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email: $('#gate-email').value, password: $('#gate-pw').value }),
    });
    const body = await res.json();
    if (!res.ok) throw new Error(body.message || '이메일이나 비밀번호가 맞지 않는다');
    TOKEN = body.idToken;                       // 이메일 클레임은 idToken 에만 있다
    sessionStorage.setItem('adminToken', TOKEN);
    $('#gate-pw').value = '';
    $('#gate').hidden = true;
    await boot();
  } catch (err) {
    $('#gate-msg').textContent = err.message;
  } finally {
    btn.disabled = false;
  }
});

$('#signout').onclick = () => {
  TOKEN = ''; sessionStorage.removeItem('adminToken');
  gate('로그아웃했다.');
};

function whoAmI() {
  if (MODE !== 'cloud' || !TOKEN) return MODE === 'local' ? '로컬 · aws 자격증명' : '';
  try { return JSON.parse(atob(TOKEN.split('.')[1].replace(/-/g, '+').replace(/_/g, '/'))).email || ''; }
  catch { return ''; }
}

async function boot() {
  try {
    COURSES = await API.courses();
  } catch (e) {
    if (e instanceof Unauthorized) return gate(e.message);
    throw e;
  }
  $('#rail').hidden = false;
  $('#page').hidden = false;
  $('#n-courses').textContent = COURSES.length;
  $('#who').textContent = whoAmI();
  $('#signout').hidden = MODE !== 'cloud';
  if (!CAN_EDIT) $('#nav-settings').hidden = true;
  if (EMBED) $('#nav-users').hidden = true;
  drawFilters(); drawSheet(); show('courses');
}

if (MODE === 'cloud' && !TOKEN) gate('');
else boot();
</script>
</body>
</html>
