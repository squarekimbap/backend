AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: tour-api - Quarkus on AWS Lambda (Function URL, no API Gateway)

Parameters:
  # 공공데이터포털 TourAPI '디코딩(Decoding)' 키. 깃엔 안 박고 배포 때 주입:
  #   sam deploy ... --parameter-overrides TourApiKey=xxxxxx
  TourApiKey:
    Type: String
    NoEcho: true
    Default: ""
    Description: 공공데이터포털 TourAPI 인증키(Decoding, raw)
  TmapAppKey:
    Type: String
    NoEcho: true
    Default: ""
    Description: TMAP appKey (보행 경로 — 내부 전용, 앱 노출 금지)
  GoogleMapsApiKey:
    Type: String
    NoEcho: true
    Default: ""
    Description: Google Maps API 키 (Elevation — 내부 전용, 앱 노출 금지)
  NaverClientId:
    Type: String
    NoEcho: true
    Default: ""
    Description: 네이버 개발자센터 검색 API Client ID (주변 맛집 교차검증 — 비우면 기능만 꺼짐)
  NaverClientSecret:
    Type: String
    NoEcho: true
    Default: ""
    Description: 네이버 개발자센터 검색 API Client Secret (내부 전용, 앱 노출 금지)
  TourAudioEnabled:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
    Description: 공공데이터포털 Odii 활용신청 완료 후 true

Resources:
  TourApi:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: tour-api
      # Quarkus amazon-lambda-http 핸들러 (Function URL의 v2 페이로드도 처리)
      Handler: io.quarkus.amazon.lambda.runtime.QuarkusStreamHandler::handleRequest
      Runtime: java21
      CodeUri: target/function.zip
      MemorySize: 1024
      # /popular은 느린 집중률 공공 API를 호출하므로 여유(콜드+업스트림 합산). 캐시 붙이면 낮춰도 됨
      Timeout: 30
      # 코드는 TOUR_API_KEY 환경변수에서 인증키를 읽는다
      Environment:
        Variables:
          TOUR_API_KEY: !Ref TourApiKey
          TMAP_APP_KEY: !Ref TmapAppKey
          GOOGLE_MAPS_API_KEY: !Ref GoogleMapsApiKey
          NAVER_CLIENT_ID: !Ref NaverClientId
          NAVER_CLIENT_SECRET: !Ref NaverClientSecret
          TOUR_AUDIO_ENABLED: !Ref TourAudioEnabled
          CACHE_TABLE: !Ref CacheTable
          ROUTE_CACHE_TABLE: !Ref RouteCacheTable
          USER_POOL_ID: !Ref UserPool
          USER_POOL_CLIENT_ID: !Ref UserPoolClient
          USERS_TABLE: !Ref UsersTable
      # Lambda 기본 실행 역할(로그 권한) + 캐시/사용자 테이블 읽기/쓰기 + Cognito 인증 API
      Policies:
        - AWSLambdaBasicExecutionRole
        - DynamoDBCrudPolicy:
            TableName: !Ref CacheTable
        # 코스 생성 쿼터와 멱등 상태 원장을 원자적으로 함께 변경한다.
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:TransactWriteItems
              Resource: !GetAtt CacheTable.Arn
        - DynamoDBCrudPolicy:
            TableName: !Ref RouteCacheTable
        - DynamoDBCrudPolicy:
            TableName: !Ref UsersTable
        - Statement:
            - Effect: Allow
              Action:
                - cognito-idp:SignUp
                - cognito-idp:ConfirmSignUp
                - cognito-idp:AdminInitiateAuth
                - cognito-idp:AdminGetUser
                - cognito-idp:AdminCreateUser
                - cognito-idp:AdminSetUserPassword
                - cognito-idp:RevokeToken
                - cognito-idp:AdminUpdateUserAttributes
                - cognito-idp:AdminDeleteUser
              Resource: !GetAtt UserPool.Arn
      # API Gateway 대신 Function URL 사용 (무료 유지). 네트워크 입구는 NONE이지만
      # 비용이 드는 /running/route-options는 앱 계층 Cognito JWT로 보호한다.
      FunctionUrlConfig:
        AuthType: NONE

  # 집중률 순위 등 일 단위 응답 캐시. provisioned 5/5 = always-free(계정 합산 25/25) 한도 내
  CacheTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: tour-api-cache
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
      ProvisionedThroughput:
        ReadCapacityUnits: 5
        WriteCapacityUnits: 5
      # ttl(epoch초) 지나면 자동 삭제 — 날짜 지난 캐시 청소
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true

  # TMAP 경로 payload·single-flight 임대 전용. 쿼터/멱등 원장 테이블과 처리량을 격리한다.
  # 기존 Cache 5/5 + Users 5/5 + RouteCache 15/15 = 계정 provisioned 합계 25/25.
  RouteCacheTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: tour-api-route-cache
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
      ProvisionedThroughput:
        ReadCapacityUnits: 15
        WriteCapacityUnits: 15
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true

  # 인증: Cognito User Pool. 이메일은 '속성'(로그인 ID 아님) — username은 백엔드가 생성
  # (email_<sha256 32자> / kakao_<회원번호>). 가입 시 이메일 확인코드 자동 발송.
  UserPool:
    Type: AWS::Cognito::UserPool
    # 위와 같은 이유. UpdateReplacePolicy는 Schema 변경 등으로 CloudFormation이
    # 풀을 '교체'하려 할 때 기존 풀(=가입자 전원)이 삭제되는 것도 함께 막는다.
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      UserPoolName: app-users
      AutoVerifiedAttributes: [email]
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireUppercase: true
          RequireLowercase: true
          RequireNumbers: true
          RequireSymbols: false

  # 백엔드 전용 클라이언트 (앱은 Cognito를 직접 호출하지 않음)
  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: backend
      UserPoolId: !Ref UserPool
      GenerateSecret: false
      ExplicitAuthFlows:
        - ALLOW_ADMIN_USER_PASSWORD_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
      # 로그아웃(RevokeToken)이 동작하려면 켜져 있어야 한다. 신규 클라이언트 기본값이지만
      # 꺼지면 로그아웃이 조용히 무력화되므로 명시한다.
      EnableTokenRevocation: true
      # 자동로그인: 앱이 refresh 토큰을 보관해 재실행 때 /v1/auth/refresh로 세션을 잇는다.
      # 기본 30일이면 한 달 안 열면 로그아웃되므로 1년으로 늘린다(최대 3650일).
      AccessTokenValidity: 1
      IdTokenValidity: 1
      RefreshTokenValidity: 365
      TokenValidityUnits:
        AccessToken: hours
        IdToken: hours
        RefreshToken: days

  # 사용자 최소 프로필. 캐시 5/5와 합산 10/10 — always-free(계정 합산 25/25) 내
  UsersTable:
    Type: AWS::DynamoDB::Table
    # 스택을 지워도(sam delete) 가입자 데이터는 남긴다. 비밀번호 해시는 백업 수단이
    # 없어 한 번 지우면 복구 불가 — 전원 재가입 외엔 방법이 없다.
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: app-users
      AttributeDefinitions:
        - AttributeName: userId
          AttributeType: S
      KeySchema:
        - AttributeName: userId
          KeyType: HASH
      ProvisionedThroughput:
        ReadCapacityUnits: 5
        WriteCapacityUnits: 5

Outputs:
  FunctionUrl:
    Description: "앱이 호출할 주소 (Lambda Function URL)"
    Value: !GetAtt TourApiUrl.FunctionUrl
