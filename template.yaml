AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: tour-api - Quarkus on AWS Lambda (Function URL, no API Gateway)

Parameters:
  # 공공데이터포털 TourAPI '디코딩(Decoding)' 키. 깃엔 안 박고 배포 때 주입:
  #   sam deploy ... --parameter-overrides TourApiKey=xxxxxx
  TourApiKey:
    Type: String
    NoEcho: true
    Default: ""
    Description: 공공데이터포털 TourAPI 인증키(Decoding, raw)

Resources:
  TourApi:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: tour-api
      # Quarkus amazon-lambda-http 핸들러 (Function URL의 v2 페이로드도 처리)
      Handler: io.quarkus.amazon.lambda.runtime.QuarkusStreamHandler::handleRequest
      Runtime: java21
      CodeUri: target/function.zip
      MemorySize: 1024
      # /popular은 느린 집중률 공공 API를 호출하므로 여유(콜드+업스트림 합산). 캐시 붙이면 낮춰도 됨
      Timeout: 30
      # 코드는 TOUR_API_KEY 환경변수에서 인증키를 읽는다
      Environment:
        Variables:
          TOUR_API_KEY: !Ref TourApiKey
          CACHE_TABLE: !Ref CacheTable
      # Lambda 기본 실행 역할(로그 권한) + 캐시 테이블 읽기/쓰기
      Policies:
        - AWSLambdaBasicExecutionRole
        - DynamoDBCrudPolicy:
            TableName: !Ref CacheTable
      # API Gateway 대신 Function URL 사용 (무료 유지). NONE = 공개 호출 가능
      FunctionUrlConfig:
        AuthType: NONE

  # 집중률 순위 등 일 단위 응답 캐시. provisioned 5/5 = always-free(계정 합산 25/25) 한도 내
  CacheTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: tour-api-cache
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
      ProvisionedThroughput:
        ReadCapacityUnits: 5
        WriteCapacityUnits: 5
      # ttl(epoch초) 지나면 자동 삭제 — 날짜 지난 캐시 청소
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true

Outputs:
  FunctionUrl:
    Description: "앱이 호출할 주소 (Lambda Function URL)"
    Value: !GetAtt TourApiUrl.FunctionUrl
